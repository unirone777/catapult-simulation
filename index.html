<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>완전요인설계법 투석기 시뮬레이션</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif;
      background: #f0f4f8;
      color: #1f2937;
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    /* ── 캔버스 카드 ── */
    .simulation-card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.10);
      overflow: hidden;
      position: relative;
      margin-bottom: 16px;
    }

    canvas {
      display: block;
      width: 100%;
      height: 500px;
    }

    .status-bar {
      position: absolute;
      left: 16px;
      top: 16px;
      pointer-events: none;
    }

    .badge {
      background: rgba(255,255,255,0.90);
      border: 1px solid rgba(255,255,255,0.95);
      border-radius: 999px;
      padding: 8px 16px;
      font-weight: 800;
      font-size: 15px;
      box-shadow: 0 4px 12px rgba(15,23,42,0.10);
    }

    /* ── 컨트롤 행 ── */
    .control-row {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 20px 24px;
      margin-bottom: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto auto;
      gap: 20px;
      align-items: end;
    }

    .factor-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .factor-label {
      font-size: 13px;
      font-weight: 700;
      color: #374151;
    }

    .factor-hint {
      font-size: 11px;
      color: #9ca3af;
      margin-bottom: 2px;
    }

    .factor-input {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #d1d5db;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 700;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      color: #111827;
    }

    .factor-input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }

    .level-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 4px;
    }

    .small-btn {
      border: 1.5px solid #bfdbfe;
      background: #eff6ff;
      color: #1e40af;
      padding: 7px 6px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      transition: background 0.12s;
    }

    .small-btn:hover { background: #dbeafe; }

    /* 발사 버튼 */
    .launch-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: stretch;
      min-width: 120px;
    }

    .launch-btn {
      border: none;
      padding: 16px 20px;
      border-radius: 12px;
      font-size: 22px;
      font-weight: 900;
      color: white;
      background: #3b5bdb;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(59,91,219,0.35);
      transition: filter 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    .launch-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .launch-btn:active { transform: translateY(0); }
    .launch-btn:disabled {
      cursor: not-allowed;
      opacity: 0.6;
      filter: grayscale(0.3);
    }

    /* 비거리 뱃지 (컨트롤 행 우측) */
    .distance-badge-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      min-width: 100px;
    }

    .distance-badge {
      background: white;
      border: 1.5px solid #e5e7eb;
      border-radius: 12px;
      padding: 10px 16px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      min-width: 90px;
    }

    .distance-badge-label {
      font-size: 11px;
      color: #9ca3af;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .distance-badge-value {
      font-size: 24px;
      font-weight: 900;
      color: #111827;
    }

    /* ── 하단 버튼 행 ── */
    .action-row {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .action-btn {
      border: 1.5px solid #d1d5db;
      background: white;
      color: #374151;
      padding: 11px 22px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 15px;
      transition: background 0.12s, border-color 0.12s;
    }

    .action-btn:hover {
      background: #f9fafb;
      border-color: #9ca3af;
    }

    .action-btn.active {
      background: #dbeafe;
      border-color: #3b82f6;
      color: #1d4ed8;
    }

    /* 목표값 입력 패널 */
    .target-inline {
      display: none;
      align-items: center;
      gap: 10px;
      background: #f0f7ff;
      border: 1.5px solid #bfdbfe;
      border-radius: 10px;
      padding: 8px 14px;
    }

    .target-inline.visible { display: flex; }

    .target-inline label {
      font-weight: 700;
      font-size: 14px;
      color: #1e40af;
      white-space: nowrap;
    }

    .target-inline input {
      width: 100px;
      padding: 7px 10px;
      border: 1.5px solid #93c5fd;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      outline: none;
      color: #111827;
    }

    .target-inline .hint-sm {
      font-size: 11px;
      color: #6b7280;
      white-space: nowrap;
    }

    /* ── 발사 결과 카드 ── */
    .result-card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 22px 24px;
    }

    .result-card h2 {
      margin: 0 0 16px;
      font-size: 22px;
      font-weight: 800;
      color: #111827;
    }

    /* 결과 박스들 */
    .result-grid {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .result-box {
      background: white;
      border: 1.5px solid #e5e7eb;
      border-radius: 12px;
      padding: 14px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      min-width: 130px;
    }

    .result-box.hidden { display: none !important; }

    .result-title {
      font-size: 12px;
      color: #9ca3af;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .result-value {
      font-size: 26px;
      font-weight: 900;
      color: #111827;
    }

    .judge-hit { color: #15803d; }
    .judge-fail { color: #b91c1c; }

    /* 테이블 */
    .table-wrap {
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 17px;
    }

    th, td {
      border-bottom: 1px solid #e5e7eb;
      padding: 13px 16px;
      text-align: center;
    }

    th {
      background: #eff6ff;
      color: #1e3a8a;
      font-weight: 800;
      font-size: 17px;
    }

    td {
      font-size: 17px;
      font-weight: 600;
    }

    tr:last-child td { border-bottom: none; }

    td strong {
      font-size: 18px;
      font-weight: 900;
    }

    .notice {
      margin-top: 12px;
      font-size: 12px;
      color: #9ca3af;
    }

    .hidden { display: none !important; }

    /* ── Unirone 로고 (control-row 내부 우측 상단) ── */
    .control-row { position: relative; }

    .unirone-logo {
      position: absolute;
      top: 12px;
      right: 20px;
      height: 28px;
      width: auto;
      display: block;
      pointer-events: none;
    }


    @media (max-width: 860px) {
      .control-row {
        grid-template-columns: 1fr 1fr;
      }
      canvas { height: 380px; }
    }
  </style>
</head>

<script>
  const canvas = document.getElementById("simCanvas");
  const ctx = canvas.getContext("2d");

  const x1Input = document.getElementById("x1");
  const x2Input = document.getElementById("x2");
  const x3Input = document.getElementById("x3");
  const targetToggleBtn = document.getElementById("targetToggleBtn");
  const targetPanel = document.getElementById("targetPanel");
  const targetDistanceInput = document.getElementById("targetDistance");
  const launchBtn = document.getElementById("launchBtn");
  const resetBtn = document.getElementById("resetBtn");
  const excelBtn = document.getElementById("excelBtn");

  const flightStatus = document.getElementById("flightStatus");
  const distanceBadgeVal = document.getElementById("distanceBadgeVal");
  const resultGrid = document.getElementById("resultGrid");
  const resultY = document.getElementById("resultY");
  const resultTarget = document.getElementById("resultTarget");
  const resultDiff = document.getElementById("resultDiff");
  const resultJudge = document.getElementById("resultJudge");
  const historyBody = document.getElementById("historyBody");

  let animationId = null;
  let launchCount = 0;
  let lastTrajectory = [];
  let launchRecords = [];
  let targetMode = false;

  const CATAPULT = {
    baseX: 50,
    scale: 0.39,
    startAngle: 60,
    releaseAngle: -28,
    settleAngle: -16,
    pivotOffsetX: 95,
    pivotOffsetY: -158,
    frontArmLength: 126,
    backArmLength: 46
  };

  function randExcel() { return Math.random(); }
  function clamp(v, mn, mx) { return Math.min(Math.max(v, mn), mx); }
  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
  function easeInOutCubic(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }

  function getInputs() {
    const x1 = Number(x1Input.value);
    const x2 = Number(x2Input.value);
    const x3 = Number(x3Input.value);
    return {
      x1: Number(clamp(Number.isFinite(x1)?x1:2,2,4).toFixed(1)),
      x2: Number(clamp(Number.isFinite(x2)?x2:1,1,5).toFixed(1)),
      x3: Math.round(clamp(Number.isFinite(x3)?x3:150,150,180))
    };
  }

  function normInv(probability, mean=0, standardDeviation=1) {
    const p = clamp(probability, 1e-12, 1-1e-12);
    const a=[-3.969683028665376e+01,2.209460984245205e+02,-2.759285104469687e+02,1.383577518672690e+02,-3.066479806614716e+01,2.506628277459239e+00];
    const b=[-5.447609879822406e+01,1.615858368580409e+02,-1.556989798598866e+02,6.680131188771972e+01,-1.328068155288572e+01];
    const c=[-7.784894002430293e-03,-3.223964580411365e-01,-2.400758277161838e+00,-2.549732539343734e+00,4.374664141464968e+00,2.938163982698783e+00];
    const d=[7.784695709041462e-03,3.224671290700398e-01,2.445134137142996e+00,3.754408661907416e+00];
    const plow=0.02425, phigh=1-plow;
    let z;
    if(p<plow){const q=Math.sqrt(-2*Math.log(p));z=(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
    else if(p<=phigh){const q=p-0.5,r=q*q;z=(((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);}
    else{const q=Math.sqrt(-2*Math.log(1-p));z=-(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
    return mean+standardDeviation*z;
  }

  function calculateDistance(x1,x2,x3) {
    const x1p=x1+0.05*normInv(randExcel(),0,0.2);
    const x2p=x2+0.1*normInv(randExcel(),0,0.2);
    const x3p=x3+0.5*normInv(randExcel(),0,0.2);
    const y=5*x1p+3.5*x2p+2*x3p+2*x1p*x3p;
    return {x1p,x2p,x3p,y};
  }

  // ── 좌표계 주의 ──
  // drawCatapult 내부에서는 좌우반전(scale(-1,1) + translate(184,0))이 적용되어
  // 로컬 x좌표는 (184 - originalX)로 변환된다. 따라서 글로벌 좌표를 반환하는
  // getPivot/getCupPosition은 그 효과를 반영하여 피벗 X와 cos 부호를 뒤집는다.
  // 이렇게 하면 컵이 피벗의 좌측에서 시작해 위로 올라가는 동작이 된다.
  const FLIP_OFFSET = 184;

  function getPivot(groundY) {
    return {
      x: CATAPULT.baseX + (FLIP_OFFSET - CATAPULT.pivotOffsetX) * CATAPULT.scale,
      y: groundY + CATAPULT.pivotOffsetY * CATAPULT.scale
    };
  }

  function getCupPosition(groundY, armAngleDeg) {
    const pivot=getPivot(groundY);
    const rad=armAngleDeg*Math.PI/180;
    return {
      // cos에 -1을 적용: 좌우반전된 그림에서 컵은 피벗 좌측에 위치
      x: pivot.x - Math.cos(rad)*CATAPULT.frontArmLength*CATAPULT.scale,
      y: pivot.y + Math.sin(rad)*CATAPULT.frontArmLength*CATAPULT.scale
    };
  }

  function drawScene(state={}) {
    const stone=state.stone||null;
    const trajectory=state.trajectory||[];
    const armAngle=typeof state.armAngle==="number"?state.armAngle:CATAPULT.startAngle;
    const showLoadedStone=state.showLoadedStone!==undefined?state.showLoadedStone:true;
    const landingMarker=state.landingMarker||null;
    const w=canvas.width, h=canvas.height;
    const groundY=h*0.72;

    ctx.clearRect(0,0,w,h);
    drawBackground(w,h,groundY);
    drawDistanceScale(w,groundY);
    drawCatapult(CATAPULT.baseX,groundY,armAngle,showLoadedStone);

    if(trajectory.length>1){
      ctx.beginPath();
      trajectory.forEach((p,i)=>{if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);});
      ctx.strokeStyle="rgba(220,38,38,0.55)";
      ctx.lineWidth=3;
      ctx.setLineDash([7,7]);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    if(stone) drawStone(stone.x,stone.y,stone.r||13);
    if(landingMarker) drawLandingMarker(landingMarker.x,groundY,landingMarker.distance);
  }

  function drawBackground(w,h,groundY) {
    const sky=ctx.createLinearGradient(0,0,0,groundY);
    sky.addColorStop(0,"#b9e4ff");
    sky.addColorStop(0.55,"#e9f7ff");
    sky.addColorStop(1,"#f6fcff");
    ctx.fillStyle=sky;
    ctx.fillRect(0,0,w,groundY);

    const sun=ctx.createRadialGradient(w-95,78,10,w-95,78,40);
    sun.addColorStop(0,"rgba(255,235,130,0.95)");
    sun.addColorStop(1,"rgba(255,235,130,0)");
    ctx.fillStyle=sun;
    ctx.beginPath();
    ctx.arc(w-95,78,42,0,Math.PI*2);
    ctx.fill();

    drawCloud(88,84,1.0);
    drawCloud(370,116,0.78);
    drawCloud(700,102,0.92);

    ctx.fillStyle="#cfe3b8";
    ctx.beginPath();
    ctx.moveTo(0,groundY);
    ctx.lineTo(80,groundY-36);
    ctx.lineTo(200,groundY-14);
    ctx.lineTo(320,groundY-56);
    ctx.lineTo(470,groundY-8);
    ctx.lineTo(620,groundY-48);
    ctx.lineTo(780,groundY-12);
    ctx.lineTo(950,groundY-55);
    ctx.lineTo(w,groundY-20);
    ctx.lineTo(w,groundY);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle="#b8d19f";
    ctx.beginPath();
    ctx.moveTo(0,groundY);
    ctx.lineTo(140,groundY-18);
    ctx.lineTo(320,groundY-2);
    ctx.lineTo(470,groundY-28);
    ctx.lineTo(650,groundY-4);
    ctx.lineTo(830,groundY-25);
    ctx.lineTo(w,groundY-8);
    ctx.lineTo(w,groundY);
    ctx.closePath();
    ctx.fill();

    const ground=ctx.createLinearGradient(0,groundY,0,h);
    ground.addColorStop(0,"#d8c2a0");
    ground.addColorStop(0.42,"#c39b69");
    ground.addColorStop(1,"#8c633b");
    ctx.fillStyle=ground;
    ctx.fillRect(0,groundY,w,h-groundY);

    ctx.strokeStyle="rgba(90,64,38,0.35)";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(0,groundY+1);
    ctx.lineTo(w,groundY+1);
    ctx.stroke();

    ctx.fillStyle="rgba(0,0,0,0.05)";
    ctx.fillRect(0,groundY+20,w,8);
  }

  // ── 비거리 ↔ 픽셀 좌표 변환 (눈금과 돌의 착지 위치가 동일한 좌표계를 공유) ──
  const DISTANCE_AXIS = {
    minDistance: 0,
    maxDistance: 2000,    // 눈금의 최대값 (실제 비거리 최대 ~1840 + 여유)
    tickStep: 250         // 눈금 간격
  };

  function getDistanceAxisRange(w, groundY) {
    // 비거리 0의 픽셀 위치 = 투석기 릴리즈 시점의 컵 X 좌표
    const releasePos = getCupPosition(groundY, CATAPULT.releaseAngle);
    const xZero = releasePos.x;
    // 비거리 최대값의 픽셀 위치 = 캔버스 우측 여유 두고 끝
    const xMax = w - 30;
    return { xZero, xMax };
  }

  function distanceToX(distance, w, groundY) {
    const { xZero, xMax } = getDistanceAxisRange(w, groundY);
    const ratio = (distance - DISTANCE_AXIS.minDistance) / (DISTANCE_AXIS.maxDistance - DISTANCE_AXIS.minDistance);
    return xZero + ratio * (xMax - xZero);
  }

  function drawDistanceScale(w, groundY) {
    const { xZero, xMax } = getDistanceAxisRange(w, groundY);

    // 눈금 배경 박스
    const boxX = xZero - 8;
    const boxW = (xMax - xZero) + 16;
    ctx.fillStyle = "rgba(255,255,255,0.78)";
    roundRect(ctx, boxX, groundY + 22, boxW, 36, 12);
    ctx.fill();
    ctx.strokeStyle = "rgba(31,41,55,0.18)";
    ctx.lineWidth = 1;
    ctx.stroke();

    // 눈금 라벨
    ctx.fillStyle = "#374151";
    ctx.font = "11px Malgun Gothic, Arial";
    ctx.textAlign = "left";
    ctx.fillText("비거리 눈금", boxX + 8, groundY + 18);

    // 눈금 (비거리 좌표계를 픽셀로 변환)
    const tickStep = DISTANCE_AXIS.tickStep;
    const totalTicks = Math.floor(DISTANCE_AXIS.maxDistance / tickStep);

    for (let i = 0; i <= totalTicks; i++) {
      const distance = i * tickStep;
      const x = distanceToX(distance, w, groundY);

      // 눈금선
      ctx.beginPath();
      ctx.moveTo(x, groundY + 24);
      ctx.lineTo(x, groundY + 36);
      ctx.strokeStyle = "rgba(31,41,55,0.45)";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // 숫자 라벨
      ctx.fillStyle = "#374151";
      ctx.font = "bold 12px Malgun Gothic, Arial";
      ctx.textAlign = "center";
      ctx.fillText(String(distance), x, groundY + 52);
    }
  }

  function drawCloud(x,y,scale) {
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    ctx.fillStyle="rgba(255,255,255,0.86)";
    ctx.beginPath();
    ctx.arc(0,12,20,0,Math.PI*2);
    ctx.arc(24,0,27,0,Math.PI*2);
    ctx.arc(55,10,22,0,Math.PI*2);
    ctx.arc(31,18,24,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function drawCatapult(baseX,groundY,armAngleDeg,showLoadedStone) {
    ctx.save();
    ctx.translate(baseX,groundY);
    ctx.scale(CATAPULT.scale,CATAPULT.scale);

    // ── 좌우반전: 컵이 왼쪽 아래에서 위로 올라가면서 돌을 오른쪽으로 던지는 형태로 표현 ──
    // 베이스의 좌우 중심(약 x=92) 기준으로 flip. translate(184,0) + scale(-1,1) = x → 184-x
    ctx.translate(184,0);
    ctx.scale(-1,1);

    // ── 그림자 ──
    const shadow=ctx.createLinearGradient(0,0,140,0);
    shadow.addColorStop(0,"rgba(0,0,0,0.18)");
    shadow.addColorStop(1,"rgba(0,0,0,0.02)");
    ctx.fillStyle=shadow;
    ctx.beginPath();
    ctx.ellipse(92,-12,98,20,0,0,Math.PI*2);
    ctx.fill();

    // ── 베이스 프레임 (수레 몸체) ──
    // 위쪽 두꺼운 빔
    const baseTop=ctx.createLinearGradient(0,-60,0,-44);
    baseTop.addColorStop(0,"#9b6a3d");
    baseTop.addColorStop(1,"#6b4423");
    ctx.fillStyle=baseTop;
    ctx.strokeStyle="#3a2210";
    ctx.lineWidth=2.5;
    roundRect(ctx,8,-60,168,18,4);
    ctx.fill();
    ctx.stroke();

    // 아래쪽 두꺼운 빔 (수레 바닥)
    const baseBot=ctx.createLinearGradient(0,-42,0,-24);
    baseBot.addColorStop(0,"#8c5d33");
    baseBot.addColorStop(1,"#5a3a1d");
    ctx.fillStyle=baseBot;
    roundRect(ctx,4,-42,176,18,4);
    ctx.fill();
    ctx.stroke();

    // 베이스 나뭇결 (위쪽 빔)
    ctx.strokeStyle="rgba(58,30,12,0.35)";
    ctx.lineWidth=1;
    for(let i=0;i<3;i++){
      ctx.beginPath();
      ctx.moveTo(14,-57+i*5);
      ctx.lineTo(170,-57+i*5);
      ctx.stroke();
    }
    // 베이스 나뭇결 (아래쪽 빔)
    for(let i=0;i<3;i++){
      ctx.beginPath();
      ctx.moveTo(10,-39+i*5);
      ctx.lineTo(174,-39+i*5);
      ctx.stroke();
    }

    // 베이스 모서리 금속 보강판 (네 귀퉁이)
    drawMetalPlate(8,-42,10,18);
    drawMetalPlate(170,-42,10,18);
    drawMetalPlate(4,-42,8,8,true);    // 좌측 하단 작은 볼트
    drawMetalPlate(172,-42,8,8,true);  // 우측 하단 작은 볼트

    // ── 바퀴 ──
    drawWheel(36,-18,20);
    drawWheel(148,-18,20);

    // ── A자형 프레임 (양쪽 다리) ──
    // 뒷쪽 다리 (피벗 95,-158 기준 양쪽으로 사다리꼴)
    drawFrameLeg(58,-60,82,-150,12);   // 왼쪽 다리
    drawFrameLeg(132,-60,108,-150,12); // 오른쪽 다리

    // 가로 들보 (윗부분, A자 꼭대기)
    const beamGrad=ctx.createLinearGradient(0,-160,0,-140);
    beamGrad.addColorStop(0,"#a06f3f");
    beamGrad.addColorStop(1,"#6b4322");
    ctx.fillStyle=beamGrad;
    ctx.strokeStyle="#3a2210";
    ctx.lineWidth=2.5;
    roundRect(ctx,72,-162,46,18,3);
    ctx.fill();
    ctx.stroke();
    // 들보 나뭇결
    ctx.strokeStyle="rgba(58,30,12,0.35)";
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(76,-157);
    ctx.lineTo(114,-157);
    ctx.moveTo(76,-150);
    ctx.lineTo(114,-150);
    ctx.stroke();

    // 들보 양쪽 끝 금속 보강판
    drawMetalPlate(70,-162,8,18);
    drawMetalPlate(112,-162,8,18);

    // 대각 보강 빔 (flip 후 화면상 좌하-컵쪽에서 들보 위로 향함)
    ctx.save();
    ctx.strokeStyle="#7c5028";
    ctx.lineWidth=11;
    ctx.lineCap="butt";
    ctx.beginPath();
    ctx.moveTo(114,-60);
    ctx.lineTo(89,-150);
    ctx.stroke();
    // 외곽선
    ctx.strokeStyle="#3a2210";
    ctx.lineWidth=2;
    const dx=89-114, dy=-150-(-60);
    const len=Math.hypot(dx,dy);
    const nx=-dy/len*5.5, ny=dx/len*5.5;
    ctx.beginPath();
    ctx.moveTo(114+nx,-60+ny);
    ctx.lineTo(89+nx,-150+ny);
    ctx.moveTo(114-nx,-60-ny);
    ctx.lineTo(89-nx,-150-ny);
    ctx.stroke();
    ctx.restore();

    // 대각 빔 하단 금속 보강판 (flip 후 좌하)
    drawMetalPlate(106,-66,18,10);

    // ── 권양기(winch) — 화면상 우측 (flip 안에서는 로컬 좌표 184-155=29 위치) ──
    // flip 변환이 적용된 컨텍스트 안이므로, 화면상 우측에 그리려면 로컬 x값을 작게 함
    drawWinch(29,-58);

    // 권양기에서 들보 위쪽으로 이어지는 로프 (좌우반전 위치)
    ctx.save();
    ctx.strokeStyle="#c9a777";
    ctx.lineWidth=3.5;
    ctx.lineCap="round";
    ctx.beginPath();
    ctx.moveTo(29,-62);
    ctx.bezierCurveTo(34,-100,54,-140,66,-150);
    ctx.stroke();
    // 로프 꼬임 무늬
    ctx.strokeStyle="rgba(120,80,40,0.55)";
    ctx.lineWidth=1.2;
    ctx.setLineDash([3,3]);
    ctx.beginPath();
    ctx.moveTo(29,-62);
    ctx.bezierCurveTo(34,-100,54,-140,66,-150);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    // ── 피벗 축 (금속 허브) ──
    const hub=ctx.createRadialGradient(93,-160,2,95,-158,14);
    hub.addColorStop(0,"#dfe5ec");
    hub.addColorStop(0.6,"#9aa3ae");
    hub.addColorStop(1,"#4b5563");
    ctx.fillStyle=hub;
    ctx.strokeStyle="#2a323d";
    ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.arc(95,-158,11,0,Math.PI*2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle="#2a323d";
    ctx.beginPath();
    ctx.arc(95,-158,4,0,Math.PI*2);
    ctx.fill();

    // ── 팔(arm) 그리기 (장전된 돌은 컵 그리기 내부에서 함께 처리) ──
    drawArm(baseX,groundY,armAngleDeg,showLoadedStone);

    ctx.restore();
  }

  // 금속 보강판 (그레이 사각형 + 볼트)
  function drawMetalPlate(x,y,w,h,singleBolt=false) {
    ctx.save();
    const g=ctx.createLinearGradient(x,y,x,y+h);
    g.addColorStop(0,"#7d8590");
    g.addColorStop(1,"#3f464f");
    ctx.fillStyle=g;
    ctx.strokeStyle="#1f242b";
    ctx.lineWidth=1.2;
    roundRect(ctx,x,y,w,h,1.5);
    ctx.fill();
    ctx.stroke();
    // 볼트
    ctx.fillStyle="#2a323d";
    if(singleBolt){
      ctx.beginPath();
      ctx.arc(x+w/2,y+h/2,1.6,0,Math.PI*2);
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(x+w/2,y+4,1.6,0,Math.PI*2);
      ctx.arc(x+w/2,y+h-4,1.6,0,Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  // A자 프레임 다리 (테이퍼 형태)
  function drawFrameLeg(x1,y1,x2,y2,thickness) {
    ctx.save();
    const dx=x2-x1, dy=y2-y1;
    const len=Math.hypot(dx,dy);
    const nx=-dy/len*thickness/2, ny=dx/len*thickness/2;
    // 본체
    const grad=ctx.createLinearGradient(x1-nx,y1-ny,x1+nx,y1+ny);
    grad.addColorStop(0,"#a06f3f");
    grad.addColorStop(0.5,"#8b5a2e");
    grad.addColorStop(1,"#5d3a1c");
    ctx.fillStyle=grad;
    ctx.strokeStyle="#3a2210";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(x1-nx,y1-ny);
    ctx.lineTo(x1+nx,y1+ny);
    ctx.lineTo(x2+nx*0.85,y2+ny*0.85);
    ctx.lineTo(x2-nx*0.85,y2-ny*0.85);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // 나뭇결
    ctx.strokeStyle="rgba(58,30,12,0.3)";
    ctx.lineWidth=0.8;
    ctx.beginPath();
    ctx.moveTo(x1*0.6+x2*0.4,y1*0.6+y2*0.4);
    ctx.lineTo(x1*0.4+x2*0.6,y1*0.4+y2*0.6);
    ctx.stroke();
    ctx.restore();
  }

  // 권양기 (로프 감긴 원통 + 핸들)
  function drawWinch(cx,cy) {
    ctx.save();
    // 원통 (메인 드럼)
    const drumGrad=ctx.createLinearGradient(cx-12,cy,cx+12,cy);
    drumGrad.addColorStop(0,"#7c5028");
    drumGrad.addColorStop(0.5,"#a87340");
    drumGrad.addColorStop(1,"#6b4322");
    ctx.fillStyle=drumGrad;
    ctx.strokeStyle="#3a2210";
    ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.ellipse(cx,cy,14,7,0,0,Math.PI*2);
    ctx.fill();
    ctx.stroke();
    // 감긴 로프 표현 (가로 줄무늬)
    ctx.strokeStyle="#c9a777";
    ctx.lineWidth=2.2;
    for(let i=-5;i<=5;i+=2){
      ctx.beginPath();
      ctx.ellipse(cx,cy+i*0.6,13,5.5,0,0,Math.PI*2);
      ctx.stroke();
    }
    // 로프 꼬임 무늬
    ctx.strokeStyle="rgba(90,60,25,0.5)";
    ctx.lineWidth=0.8;
    for(let i=-4;i<=4;i+=2){
      ctx.beginPath();
      ctx.ellipse(cx,cy+i*0.6,13,5.5,0,0,Math.PI*2);
      ctx.stroke();
    }

    // 핸들 (왼쪽으로 튀어나온 막대 — flip 후 화면상 우측에 보임)
    ctx.fillStyle="#8b5a2e";
    ctx.strokeStyle="#3a2210";
    ctx.lineWidth=1.2;
    roundRect(ctx,cx-26,cy-2,16,4,1.5);
    ctx.fill();
    ctx.stroke();
    // 핸들 손잡이 (T자 끝)
    ctx.fillStyle="#a06f3f";
    roundRect(ctx,cx-29,cy-7,5,14,2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function drawWheel(x,y,r) {
    // 바깥 나무 바퀴
    const wheelGrad=ctx.createRadialGradient(x-r/3,y-r/3,r*0.2,x,y,r);
    wheelGrad.addColorStop(0,"#a06f3f");
    wheelGrad.addColorStop(0.6,"#7c5028");
    wheelGrad.addColorStop(1,"#4a2d12");
    ctx.fillStyle=wheelGrad;
    ctx.strokeStyle="#2a1808";
    ctx.lineWidth=2.2;
    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fill();
    ctx.stroke();

    // 나뭇결 (호 형태)
    ctx.strokeStyle="rgba(42,24,8,0.35)";
    ctx.lineWidth=1;
    for(let i=1;i<=2;i++){
      ctx.beginPath();
      ctx.arc(x,y,r*(0.55+i*0.15),Math.PI*0.15,Math.PI*0.85);
      ctx.stroke();
    }

    // 중앙 금속 허브 (회색)
    const hubGrad=ctx.createRadialGradient(x-2,y-2,1,x,y,r*0.36);
    hubGrad.addColorStop(0,"#9aa3ae");
    hubGrad.addColorStop(1,"#3f464f");
    ctx.fillStyle=hubGrad;
    ctx.strokeStyle="#1f242b";
    ctx.lineWidth=1.2;
    ctx.beginPath();
    ctx.arc(x,y,r*0.36,0,Math.PI*2);
    ctx.fill();
    ctx.stroke();

    // 중앙 볼트
    ctx.fillStyle="#1f242b";
    ctx.beginPath();
    ctx.arc(x,y,r*0.13,0,Math.PI*2);
    ctx.fill();
  }

  function drawArm(baseX,groundY,armAngleDeg,showLoadedStone=false) {
    const localPivot={x:CATAPULT.pivotOffsetX,y:CATAPULT.pivotOffsetY};
    const rad=armAngleDeg*Math.PI/180;
    const frontX=localPivot.x+Math.cos(rad)*CATAPULT.frontArmLength;
    const frontY=localPivot.y+Math.sin(rad)*CATAPULT.frontArmLength;
    const backX=localPivot.x-Math.cos(rad)*CATAPULT.backArmLength;
    const backY=localPivot.y-Math.sin(rad)*CATAPULT.backArmLength;

    // ── 팔 그림자 ──
    ctx.strokeStyle="rgba(0,0,0,0.18)";
    ctx.lineWidth=18;
    ctx.lineCap="round";
    ctx.beginPath();
    ctx.moveTo(localPivot.x+3,localPivot.y+5);
    ctx.lineTo(frontX+3,frontY+5);
    ctx.stroke();

    // ── 팔 본체 (굵은 나무 빔) ──
    const armGrad=ctx.createLinearGradient(backX,backY,frontX,frontY);
    armGrad.addColorStop(0,"#7c5028");
    armGrad.addColorStop(0.5,"#a87340");
    armGrad.addColorStop(1,"#6b4322");
    ctx.strokeStyle=armGrad;
    ctx.lineWidth=16;
    ctx.lineCap="round";
    ctx.beginPath();
    ctx.moveTo(backX,backY);
    ctx.lineTo(frontX,frontY);
    ctx.stroke();

    // 팔 외곽선 (어두운 테두리 효과)
    ctx.save();
    const dx=frontX-backX, dy=frontY-backY;
    const len=Math.hypot(dx,dy);
    const nx=-dy/len*8, ny=dx/len*8;
    ctx.strokeStyle="#3a2210";
    ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(backX+nx,backY+ny);
    ctx.lineTo(frontX+nx*0.9,frontY+ny*0.9);
    ctx.moveTo(backX-nx,backY-ny);
    ctx.lineTo(frontX-nx*0.9,frontY-ny*0.9);
    ctx.stroke();
    ctx.restore();

    // 팔 나뭇결 하이라이트
    ctx.strokeStyle="rgba(255,235,200,0.25)";
    ctx.lineWidth=2;
    ctx.lineCap="round";
    ctx.beginPath();
    ctx.moveTo(backX+Math.cos(rad+Math.PI/2)*3,backY+Math.sin(rad+Math.PI/2)*3);
    ctx.lineTo(frontX+Math.cos(rad+Math.PI/2)*3,frontY+Math.sin(rad+Math.PI/2)*3);
    ctx.stroke();

    // ── 컵 근처 로프 감김 ──
    // 컵에서 약간 안쪽(피벗 방향)으로 떨어진 위치에 로프를 여러 번 감음
    const ropeT=0.78; // 0=피벗, 1=컵
    const ropeCenterX=localPivot.x+(frontX-localPivot.x)*ropeT;
    const ropeCenterY=localPivot.y+(frontY-localPivot.y)*ropeT;
    ctx.save();
    ctx.translate(ropeCenterX,ropeCenterY);
    ctx.rotate(rad);
    // 로프 감김 (8회)
    for(let i=-4;i<=4;i++){
      const ropeGrad=ctx.createLinearGradient(0,-9,0,9);
      ropeGrad.addColorStop(0,"#d4b380");
      ropeGrad.addColorStop(0.5,"#a87a45");
      ropeGrad.addColorStop(1,"#6e4a25");
      ctx.fillStyle=ropeGrad;
      ctx.strokeStyle="#3a2210";
      ctx.lineWidth=0.8;
      ctx.beginPath();
      ctx.ellipse(i*2.6,0,1.7,9,0,0,Math.PI*2);
      ctx.fill();
      ctx.stroke();
    }
    ctx.restore();

    // ── 컵(그릇 모양 보울) ──
    // 컵은 팔에 부착되어 있지만, 회전 보정을 부분적으로만 적용해
    // 어떤 팔 각도에서도 컵 입구가 거의 글로벌 위쪽을 향하도록 한다
    // (실제 슬링형 투석기에서 컵이 자유롭게 흔들려 중력 방향을 따르는 것과 유사한 효과).
    ctx.save();
    ctx.translate(frontX,frontY);
    const cupRot=rad*0.4;  // 부분 회전: 팔 회전의 40%만 컵에 적용
    ctx.rotate(cupRot);
    // 컵을 팔 끝보다 살짝 앞쪽으로(+x, 단 cupRot 좌표계 기준) 이동
    ctx.translate(8,0);

    // 그릇 외부 (반원 보울)
    const bowlGrad=ctx.createLinearGradient(0,-30,0,12);
    bowlGrad.addColorStop(0,"#a06f3f");
    bowlGrad.addColorStop(0.5,"#7c5028");
    bowlGrad.addColorStop(1,"#4a2d12");
    ctx.fillStyle=bowlGrad;
    ctx.strokeStyle="#2a1808";
    ctx.lineWidth=2.5;
    ctx.beginPath();
    // 그릇 형태: 위쪽(-y) 열림, 아래쪽(+y) 둥근 받침
    ctx.moveTo(-26,-28);
    ctx.bezierCurveTo(-30,2,-16,12,0,12);
    ctx.bezierCurveTo(16,12,30,2,26,-28);
    ctx.lineTo(-26,-28);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // ── 장전된 돌 (컵 안쪽에 잠긴 형태) ──
    // 컵 외부를 그린 직후, 입구 그림자 그리기 직전에 돌을 그려야
    // 돌의 윗부분이 입구 림(타원)에 의해 살짝 가려져 "컵 안에 들어있는" 효과가 난다
    if(showLoadedStone){
      // 돌 중심을 입구 라인(y=-28)보다 약간 아래(y=-18)에 둠 → 돌의 위쪽 일부가
      // 곧이어 그려지는 입구 타원에 가려져 컵 속에 잠긴 모양이 된다.
      // drawStone은 현재 ctx 변환(컵의 translate+rotate, 그 위의 scale)을
      // 자동으로 적용받으므로 좌표/반지름은 모두 컵 로컬 단위(이미 scale 0.39 안)로
      // 해석된다. 컵 안쪽 폭(약 50)을 기준으로 돌 반지름 ~18이 적절.
      drawStone(0,-18,18);
    }

    // 그릇 안쪽 그림자 (입구 타원, y=-28 근처)
    // 이 타원이 돌 윗부분을 살짝 덮어 잠긴 효과를 만든다
    const innerGrad=ctx.createLinearGradient(0,-32,0,-18);
    innerGrad.addColorStop(0,"#2a1808");
    innerGrad.addColorStop(1,"#5d3a1c");
    ctx.fillStyle=innerGrad;
    ctx.beginPath();
    ctx.ellipse(0,-28,26,7,0,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle="#2a1808";
    ctx.lineWidth=1.8;
    ctx.stroke();

    // 그릇 외측 나뭇결 곡선 (받침 아래쪽 호)
    ctx.strokeStyle="rgba(42,24,8,0.45)";
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(-22,-12);
    ctx.bezierCurveTo(-18,4,18,4,22,-12);
    ctx.moveTo(-18,-4);
    ctx.bezierCurveTo(-12,8,12,8,18,-4);
    ctx.stroke();

    ctx.restore();
  }

  function drawStone(x,y,r) {
    const grad=ctx.createRadialGradient(x-r/3,y-r/3,2,x,y,r);
    grad.addColorStop(0,"#b4bcc7");
    grad.addColorStop(0.45,"#818b97");
    grad.addColorStop(1,"#3f4a56");
    ctx.fillStyle=grad;
    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle="rgba(17,24,39,0.45)";
    ctx.lineWidth=2;
    ctx.stroke();
  }

  function animateLaunch(distance, onComplete=null) {
    if(animationId) cancelAnimationFrame(animationId);
    const w=canvas.width, h=canvas.height;
    const groundY=h*0.72;
    const setupDuration=620, flightDuration=1260;
    const startTime=performance.now();
    const releasePos=getCupPosition(groundY,CATAPULT.releaseAngle);
    // 눈금과 동일한 좌표 변환을 사용해 착지 위치 결정
    const targetX = distanceToX(distance, w, groundY);
    const endX = clamp(targetX, releasePos.x + 40, w - 25);
    const end={x:endX,y:groundY-14};
    const naturalPeakHeight=115+Math.min(95,distance/12);
    const availablePeakHeight=Math.max(70,releasePos.y-34);
    const peakHeight=Math.min(naturalPeakHeight,availablePeakHeight);

    lastTrajectory=[];
    launchBtn.disabled=true;

    function frame(now) {
      const elapsed=now-startTime;
      if(elapsed<=setupDuration){
        const t=clamp(elapsed/setupDuration,0,1);
        const armAngle=CATAPULT.startAngle+(CATAPULT.releaseAngle-CATAPULT.startAngle)*easeInOutCubic(t);
        flightStatus.textContent="발사 준비";
        drawScene({armAngle,showLoadedStone:true,trajectory:[],stone:null});
        animationId=requestAnimationFrame(frame);
        return;
      }
      const flyElapsed=elapsed-setupDuration;
      const t=clamp(flyElapsed/flightDuration,0,1);
      const ease=easeOutCubic(t);
      const x=releasePos.x+(end.x-releasePos.x)*ease;
      const linearY=releasePos.y+(end.y-releasePos.y)*ease;
      const arcY=linearY-Math.sin(Math.PI*ease)*peakHeight;
      const settle=clamp(flyElapsed/340,0,1);
      const armAngle=CATAPULT.releaseAngle+(CATAPULT.settleAngle-CATAPULT.releaseAngle)*easeOutCubic(settle);

      if(lastTrajectory.length===0||Math.abs(lastTrajectory[lastTrajectory.length-1].x-x)>6){
        lastTrajectory.push({x,y:arcY});
      }
      flightStatus.textContent=t<1?"비행 중":"착지 완료";
      drawScene({armAngle,showLoadedStone:false,stone:{x,y:arcY,r:7},trajectory:lastTrajectory,landingMarker:t>=1?{x:end.x,distance}:null});

      if(t<1){
        animationId=requestAnimationFrame(frame);
      } else {
        if(distanceBadgeVal) distanceBadgeVal.textContent=Math.round(distance);
        launchBtn.disabled=false;
        animationId=null;
        if(typeof onComplete==="function") onComplete();
      }
    }
    animationId=requestAnimationFrame(frame);
  }

  function drawLandingMarker(x,groundY,distance) {
    ctx.save();
    ctx.strokeStyle="#dc2626";
    ctx.fillStyle="#dc2626";
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(x,groundY-36);
    ctx.lineTo(x,groundY+8);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x,groundY-36,6,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle="rgba(255,255,255,0.92)";
    roundRect(ctx,x-66,groundY-78,132,32,10);
    ctx.fill();
    ctx.strokeStyle="rgba(220,38,38,0.35)";
    ctx.stroke();
    ctx.fillStyle="#991b1b";
    ctx.font="bold 14px Malgun Gothic, Arial";
    ctx.textAlign="center";
    ctx.fillText(`비거리 ${Math.round(distance)}`,x,groundY-57);
    ctx.restore();
  }

  function roundRect(ctx,x,y,width,height,radius) {
    ctx.beginPath();
    ctx.moveTo(x+radius,y);
    ctx.lineTo(x+width-radius,y);
    ctx.quadraticCurveTo(x+width,y,x+width,y+radius);
    ctx.lineTo(x+width,y+height-radius);
    ctx.quadraticCurveTo(x+width,y+height,x+width-radius,y+height);
    ctx.lineTo(x+radius,y+height);
    ctx.quadraticCurveTo(x,y+height,x,y+height-radius);
    ctx.lineTo(x,y+radius);
    ctx.quadraticCurveTo(x,y,x+radius,y);
    ctx.closePath();
  }

  function setTargetMode(enabled) {
    targetMode=enabled;
    if(enabled){
      targetPanel.classList.add("visible");
      targetDistanceInput.disabled=false;
      targetToggleBtn.classList.add("active");
    } else {
      targetPanel.classList.remove("visible");
      targetDistanceInput.disabled=true;
      targetToggleBtn.classList.remove("active");
    }
    document.querySelectorAll(".target-only").forEach(el=>{
      el.classList.toggle("hidden",!enabled);
    });
    if(!enabled){
      resultTarget.textContent="-";
      resultDiff.textContent="-";
      resultJudge.textContent="-";
      resultJudge.className="result-value";
    }
  }

  function getTargetDistance() {
    const value=Number(targetDistanceInput.value);
    return Math.max(0,Math.round(Number.isFinite(value)?value:500));
  }

  function getJudge(diff) { return diff>=-10&&diff<=10?"명중":"실패"; }

  function updateTargetResult(distance) {
    if(!targetMode){
      resultTarget.textContent="-";
      resultDiff.textContent="-";
      resultJudge.textContent="-";
      resultJudge.className="result-value";
      return null;
    }
    const targetDistance=getTargetDistance();
    targetDistanceInput.value=targetDistance.toString();
    const diff=distance-targetDistance;
    const judge=getJudge(diff);
    resultTarget.textContent=targetDistance.toString();
    resultDiff.textContent=diff>0?`+${diff}`:diff.toString();
    resultJudge.textContent=judge;
    resultJudge.className=`result-value ${judge==="명중"?"judge-hit":"judge-fail"}`;
    return {targetDistance,diff,judge};
  }

  function updateResults(input,calc) {
    const roundedDistance=Math.round(calc.y);
    const targetResult=updateTargetResult(roundedDistance);
    resultY.textContent=roundedDistance.toString();
    if(distanceBadgeVal) distanceBadgeVal.textContent=roundedDistance.toString();

    launchCount+=1;
    if(launchCount===1) historyBody.innerHTML="";

    const record={
      round:launchCount,
      pinPosition:Number(input.x1.toFixed(1)),
      hookPosition:Number(input.x2.toFixed(1)),
      pullAngle:Number(input.x3.toFixed(0)),
      distance:roundedDistance,
      targetDistance:targetResult?targetResult.targetDistance:"",
      diff:targetResult?targetResult.diff:"",
      judge:targetResult?targetResult.judge:""
    };
    launchRecords.unshift(record);

    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${record.round}</td>
      <td>${record.pinPosition.toFixed(1)}</td>
      <td>${record.hookPosition.toFixed(1)}</td>
      <td>${record.pullAngle.toFixed(0)}</td>
      <td><strong>${record.distance}</strong></td>
    `;
    historyBody.prepend(tr);
  }

  function resetSimulation() {
    if(animationId){cancelAnimationFrame(animationId);animationId=null;}
    launchCount=0;launchRecords=[];lastTrajectory=[];
    resultY.textContent="-";
    resultTarget.textContent="-";
    resultDiff.textContent="-";
    resultJudge.textContent="-";
    resultJudge.className="result-value";
    if(distanceBadgeVal) distanceBadgeVal.textContent="-";
    flightStatus.textContent="대기 중";
    historyBody.innerHTML='<tr><td colspan="5">아직 발사 결과가 없습니다.</td></tr>';
    launchBtn.disabled=false;
    drawScene({armAngle:CATAPULT.startAngle,showLoadedStone:true,trajectory:[],stone:null});
  }

  function exportLaunchRecordsToExcel() {
    if(launchRecords.length===0){alert("저장할 발사기록이 없습니다.");return;}
    const rows=[["회차","핀 위치","후크 위치","당김각","비거리","목표값","비거리-목표값","판정"]];
    [...launchRecords].reverse().forEach(record=>{
      rows.push([record.round,record.pinPosition,record.hookPosition,record.pullAngle,record.distance,record.targetDistance,record.diff,record.judge]);
    });
    const worksheetXml=rows.map(row=>{
      const cells=row.map(cell=>{
        const isNumber=typeof cell==="number";
        const safeCell=String(cell).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
        return isNumber?`<Cell><Data ss:Type="Number">${safeCell}</Data></Cell>`:`<Cell><Data ss:Type="String">${safeCell}</Data></Cell>`;
      }).join("");
      return `<Row>${cells}</Row>`;
    }).join("");
    const excelXml=`<?xml version="1.0"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet" xmlns:html="http://www.w3.org/TR/REC-html40"><Worksheet ss:Name="발사기록"><Table>${worksheetXml}</Table></Worksheet></Workbook>`;
    const blob=new Blob([excelXml],{type:"application/vnd.ms-excel;charset=utf-8;"});
    const url=URL.createObjectURL(blob);
    const link=document.createElement("a");
    link.href=url;link.download="투석기_발사기록.xls";
    document.body.appendChild(link);link.click();
    document.body.removeChild(link);URL.revokeObjectURL(url);
  }

  document.querySelectorAll(".small-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const target=document.getElementById(btn.dataset.target);
      target.value=btn.dataset.value;
    });
  });

  targetToggleBtn.addEventListener("click",()=>setTargetMode(!targetMode));
  resetBtn.addEventListener("click",resetSimulation);
  excelBtn.addEventListener("click",exportLaunchRecordsToExcel);

  launchBtn.addEventListener("click",()=>{
    const input=getInputs();
    x1Input.value=input.x1.toFixed(1);
    x2Input.value=input.x2.toFixed(1);
    x3Input.value=input.x3.toFixed(0);
    if(targetMode) targetDistanceInput.value=getTargetDistance().toString();
    const calc=calculateDistance(input.x1,input.x2,input.x3);
    animateLaunch(calc.y,()=>updateResults(input,calc));
  });

  setTargetMode(false);
  drawScene({armAngle:CATAPULT.startAngle,showLoadedStone:true,trajectory:[],stone:null});
</script>
